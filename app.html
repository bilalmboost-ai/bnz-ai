<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BNZ Ops Workspace</title>
<style>
:root{--bg:#0b0d10;--card:#171b21;--ink:#eef0f2;--muted:#8b949e;--line:#262b33;--orange:#e07a3d}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:260px 1fr 360px;height:100%}
aside,main,.chat{border-right:1px solid var(--line);overflow:auto}.chat{border-right:0}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.04em;font-size:.8rem}
.nav button,.company{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:10px 16px;cursor:pointer}
.nav button.active,.company.active{background:#1c222b;color:var(--orange)}
.muted{color:var(--muted);font-size:.8rem;padding:8px 16px}
header.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.pill{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.wrap{padding:20px}h2{margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
input,textarea,select{width:100%;background:#0e1116;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;margin:6px 0 12px}
button.primary{background:var(--orange);border:0;color:#fff;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}
.msg.user{background:#1a1512}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;color:var(--muted)}
</style></head><body>
<div class="app">
<aside>
<div class="brand">BNZ OPS WORKSPACE</div>
<div class="muted">Companies</div>
<div id="companyList"></div>
<div class="muted">Views</div>
<div class="nav">
<button class="active" data-view="overview">Overview</button>
<button data-view="jobs">Jobs</button>
<button data-view="vendors">Vendors</button>
<button data-view="setup">New company</button>
</div>
<p class="muted">Each company is isolated. Bonding numbers stay off this screen.</p>
</aside>
<main>
<header class="bar"><div><div id="coName" style="font-weight:700">—</div><div id="coMeta" class="muted" style="padding:0"></div></div><span class="pill">US GCs</span></header>
<div class="wrap" id="view"></div>
</main>
<section class="chat">
<header class="bar"><div><strong id="agentName">Sara</strong><div class="muted" style="padding:0" id="agentRole">Procurement</div></div>
<select id="agentPick"><option value="sara">Sara</option><option value="emma">Emma</option><option value="taylor">Taylor</option></select></header>
<div class="wrap" id="thread"></div>
<div class="wrap"><textarea id="prompt" rows="3" placeholder="Ask the active agent…"></textarea><button class="primary" id="send">Send</button></div>
</section></div>
<script>
const SEED={bnz:{id:"bnz",name:"BNZ Builders INC",city:"Cedarhurst, NY",serviceArea:"United States (home base: New York State)",phone:"1-332-258-1401",email:"bnzbuilders1@gmail.com",pmEmail:"saracooper@bnzbuildersinc.com",website:"https://buildwithbnz.com/",trades:["General contracting","Commercial renovation","Residential renovation","Painting","Drywall","Interior fit-out","Demolition","Public works interiors"],notes:"Same PM who scopes the job runs it to close-out. Bonding capacity is private.",jobs:[{name:"Institutional interior renovation",loc:"New York",status:"Active",trade:"Interiors"},{name:"Commercial tenant fit-out",loc:"Tri-state",status:"Close-out",trade:"GC / drywall / paint"}],vendors:[{name:"Vetted NYS bench",trade:"Multi-trade",status:"Preferred"}]}};
const AGENTS={sara:{name:"Sara",role:"Procurement & inbox"},emma:{name:"Emma",role:"Subcontractor desk"},taylor:{name:"Taylor",role:"Master estimator"}};
function load(){return Object.assign({},SEED,JSON.parse(localStorage.getItem("bnz_tenants")||"{}"))}
function saveTenant(t){const e=JSON.parse(localStorage.getItem("bnz_tenants")||"{}");e[t.id]=t;localStorage.setItem("bnz_tenants",JSON.stringify(e))}
let state={companies:load(),active:"bnz",view:"overview",agent:"sara"};
function company(){return state.companies[state.active]}
function renderCompanies(){const el=document.getElementById("companyList");el.innerHTML=Object.values(state.companies).map(c=>`<button class="company ${c.id===state.active?"active":""}" data-id="${c.id}">${c.name}</button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.active=b.dataset.id;paint();});}
function overview(){const c=company();return `<h2>${c.name}</h2><p class="muted" style="padding:0 0 12px">${c.city||""} · ${c.serviceArea||""}</p><div class="cards"><div class="card"><strong>Phone</strong><p>${c.phone||"—"}</p></div><div class="card"><strong>Office</strong><p>${c.email||"—"}</p></div><div class="card"><strong>PM desk</strong><p>${c.pmEmail||"—"}</p></div><div class="card"><strong>Jobs</strong><p>${(c.jobs||[]).length}</p></div></div><div class="card" style="margin-top:12px"><strong>Trades</strong><p>${(c.trades||[]).join(" · ")}</p><p>${c.notes||""}</p></div>`}
function jobs(){const rows=(company().jobs||[]).map(j=>`<tr><td>${j.name}</td><td>${j.loc||""}</td><td>${j.trade||""}</td><td>${j.status||""}</td></tr>`).join("")||`<tr><td colspan="4">No jobs yet</td></tr>`;return `<h2>Jobs</h2><table><tr><th>Job</th><th>Location</th><th>Scope</th><th>Status</th></tr>${rows}</table>`}
function vendors(){const rows=(company().vendors||[]).map(v=>`<tr><td>${v.name}</td><td>${v.trade||""}</td><td>${v.status||""}</td></tr>`).join("")||`<tr><td colspan="3">No vendors yet</td></tr>`;return `<h2>Vendors</h2><table><tr><th>Company</th><th>Trade</th><th>Status</th></tr>${rows}</table>`}
function setup(){return `<h2>Add another GC workspace</h2><p class="muted" style="padding:0 0 8px">Do not mix another contractor’s jobs into BNZ.</p><label>Company name</label><input id="n"/><label>City / state</label><input id="city"/><label>Phone</label><input id="ph"/><label>Email</label><input id="em"/><label>Trades</label><input id="tr"/><button class="primary" id="createCo">Create workspace</button>`}
function reply(text){const c=company();const a=AGENTS[state.agent];if(state.agent==="taylor")return `${a.name} — ${c.name}\nI will not invent a bid number from chat. Send drawings, specs, and bid date.\nJobs on file: ${(c.jobs||[]).map(j=>j.name).join("; ")||"none"}.`;if(state.agent==="emma")return `${a.name} — ${c.name}\nI hunt vendors new to this workspace unless you say otherwise.\nNeed trade, county, due date, prevailing wage yes/no.\nBench: ${(c.vendors||[]).map(v=>v.name).join("; ")||"empty"}.`;return `${a.name} — ${c.name}\n${c.phone||""} · ${c.email||""}\nI draft RFQs and chase quotes inside this company only.\nYou asked: ${text}`}
function paint(){renderCompanies();const c=company();document.getElementById("coName").textContent=c.name;document.getElementById("coMeta").textContent=[c.city,c.phone].filter(Boolean).join(" · ");document.getElementById("view").innerHTML=state.view==="jobs"?jobs():state.view==="vendors"?vendors():state.view==="setup"?setup():overview();const a=AGENTS[state.agent];document.getElementById("agentName").textContent=a.name;document.getElementById("agentRole").textContent=a.role;if(state.view==="setup"){document.getElementById("createCo").onclick=()=>{const name=document.getElementById("n").value.trim();if(!name)return;const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);saveTenant({id,name,city:document.getElementById("city").value,phone:document.getElementById("ph").value,email:document.getElementById("em").value,trades:document.getElementById("tr").value.split(",").map(s=>s.trim()).filter(Boolean),jobs:[],vendors:[],notes:"Customer tenant.",serviceArea:"United States"});state.companies=load();state.active=id;state.view="overview";paint();};}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));paint();});
document.getElementById("agentPick").onchange=e=>{state.agent=e.target.value;paint();};
document.getElementById("send").onclick=()=>{const box=document.getElementById("prompt");const text=box.value.trim();if(!text)return;document.getElementById("thread").innerHTML+=`<div class="msg user">${text}</div><div class="msg">${reply(text)}</div>`;box.value="";};
paint();
</script></body></html>
