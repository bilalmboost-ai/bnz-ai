<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BNZ Ops Workspace</title>
<style>
:root{--bg:#0b0d10;--card:#171b21;--ink:#eef0f2;--muted:#8b949e;--line:#262b33;--orange:#e07a3d}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:240px 1fr 340px;height:100%}
aside,main,.chat{border-right:1px solid var(--line);overflow:auto}.chat{border-right:0}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.04em;font-size:.8rem}
.nav button,.company{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:10px 16px;cursor:pointer}
.nav button.active,.company.active{background:#1c222b;color:var(--orange)}
.muted{color:var(--muted);font-size:.8rem;padding:8px 16px}
header.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.pill{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.wrap{padding:20px}h2{margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
input,textarea,select{width:100%;background:#0e1116;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;margin:6px 0 12px}
button.primary{background:var(--orange);border:0;color:#fff;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap}
.msg.user{background:#1a1512}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;color:var(--muted)}
a{color:var(--orange)}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto;min-height:100%}aside,.chat{border-right:0;border-bottom:1px solid var(--line)}.cards{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
<aside>
<div class="brand">BNZ OPS WORKSPACE</div>
<div class="muted">Companies</div>
<div id="companyList"></div>
<div class="muted">Views</div>
<div class="nav">
<button class="active" data-view="overview">Overview</button>
<button data-view="jobs">Jobs</button>
<button data-view="vendors">Vendors</button>
<button data-view="rfq">RFQ</button>
<button data-view="setup">New company</button>
</div>
<p class="muted">Each company is isolated. Bonding numbers stay off this screen.</p>
<p class="muted"><a href="index.html">Marketing</a> · <a href="sara.html">Sara</a> · <a href="emma.html">Emma</a> · <a href="taylor.html">Taylor</a></p>
</aside>
<main>
<header class="bar"><div><div id="coName" style="font-weight:700">—</div><div id="coMeta" class="muted" style="padding:0"></div></div><span class="pill">US GCs</span></header>
<div class="wrap" id="view"></div>
</main>
<section class="chat">
<header class="bar"><div><strong id="agentName">Sara</strong><div class="muted" style="padding:0" id="agentRole">Procurement</div></div>
<select id="agentPick"><option value="sara">Sara</option><option value="emma">Emma</option><option value="taylor">Taylor</option></select></header>
<div class="wrap" id="thread"></div>
<div class="wrap"><textarea id="prompt" rows="3" placeholder="Ask the active agent…"></textarea><button class="primary" id="send">Send</button>
<p class="muted" style="padding:8px 0 0"><a id="liveBot" href="sara.html">Open live Sara bot</a></p></div>
</section></div>
<script>
const SEED={bnz:{id:"bnz",name:"BNZ Builders INC",city:"Cedarhurst, NY",serviceArea:"United States",phone:"1-332-258-1401",email:"bnzbuilders1@gmail.com",pmEmail:"saracooper@bnzbuildersinc.com",website:"https://buildwithbnz.com/",trades:["General contracting","Commercial renovation","Painting","Drywall","Interior fit-out","Public works interiors"],notes:"Same PM who scopes the job runs it to close-out. Bonding capacity is private.",jobs:[{name:"Institutional interior renovation",loc:"New York",status:"Active",trade:"Interiors"},{name:"Commercial tenant fit-out",loc:"Tri-state",status:"Close-out",trade:"GC / drywall / paint"}],vendors:[{name:"Vetted NYS bench",trade:"Multi-trade",status:"Preferred"}]}};
const AGENTS={sara:{name:"Sara",role:"Procurement & inbox",page:"sara.html"},emma:{name:"Emma",role:"Accountant + subs",page:"emma.html"},taylor:{name:"Taylor",role:"Master estimator",page:"taylor.html"}};
function load(){return Object.assign({},JSON.parse(JSON.stringify(SEED)),JSON.parse(localStorage.getItem("bnz_tenants")||"{}"))}
function persist(c){const e=JSON.parse(localStorage.getItem("bnz_tenants")||"{}");e[c.id]=c;localStorage.setItem("bnz_tenants",JSON.stringify(e))}
let state={companies:load(),active:"bnz",view:"overview",agent:"sara"};
function company(){return state.companies[state.active]}
function draftRfq(c,trade,job,due,wage){if(!trade.trim())return "Trade is required.";return `Subject: Invitation to Bid — ${trade}${job?` — ${job}`:""}\n\n${c.name}\n${c.city||""}\n${c.phone||""} · ${c.email||""}\n\nPlease provide a lump-sum quote for the ${trade} scope.\nDue: ${due||"[bid date]"}\nPrevailing wage / certified payroll: ${wage||"Confirm if required"}\n\nInclude:\n1. Base bid\n2. Unit prices for likely extras\n3. Lead time\n4. Insurance / workers comp certificate\n5. Exceptions to the drawings\n\nQuote requested within 7 calendar days.\n\nThank you,\n${c.name} — Operations`;}
function renderCompanies(){const el=document.getElementById("companyList");el.innerHTML=Object.values(state.companies).map(c=>`<button class="company ${c.id===state.active?"active":""}" data-id="${c.id}">${c.name}</button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.active=b.dataset.id;paint();});}
function overview(){const c=company();return `<h2>${c.name}</h2><p class="muted" style="padding:0 0 12px">${c.city||""} · ${c.serviceArea||""}</p><div class="cards"><div class="card"><strong>Phone</strong><p>${c.phone||"—"}</p></div><div class="card"><strong>Office</strong><p>${c.email||"—"}</p></div><div class="card"><strong>PM desk</strong><p>${c.pmEmail||"—"}</p></div><div class="card"><strong>Jobs</strong><p>${(c.jobs||[]).length}</p></div></div><div class="card" style="margin-top:12px"><strong>Trades</strong><p>${(c.trades||[]).join(" · ")}</p><p>${c.notes||""}</p></div>`}
function jobs(){const rows=(company().jobs||[]).map(j=>`<tr><td>${j.name}</td><td>${j.loc||""}</td><td>${j.trade||""}</td><td>${j.status||""}</td></tr>`).join("")||`<tr><td colspan="4">No jobs yet</td></tr>`;return `<h2>Jobs</h2><table><tr><th>Job</th><th>Location</th><th>Scope</th><th>Status</th></tr>${rows}</table><h3>Add job</h3><input id="jn" placeholder="Job name"/><input id="jl" placeholder="Location"/><input id="jt" placeholder="Trade"/><input id="js" placeholder="Status" value="Bidding"/><button class="primary" id="saveJob">Save job</button>`}
function vendors(){const rows=(company().vendors||[]).map(v=>`<tr><td>${v.name}</td><td>${v.trade||""}</td><td>${v.status||""}</td></tr>`).join("")||`<tr><td colspan="3">No vendors yet</td></tr>`;return `<h2>Vendors</h2><table><tr><th>Company</th><th>Trade</th><th>Status</th></tr>${rows}</table><h3>Add vendor</h3><input id="vn" placeholder="Vendor name"/><input id="vt" placeholder="Trade"/><input id="vs" placeholder="Status" value="New"/><button class="primary" id="saveVendor">Save vendor</button>`}
function rfq(){return `<h2>RFQ</h2><p class="muted" style="padding:0 0 8px">Sara drafts. No invented bid dollars.</p><input id="rt" placeholder="Trade (required)"/><input id="rj" placeholder="Job"/><input id="rd" placeholder="Due date"/><input id="rw" placeholder="Prevailing wage" value="Confirm"/><button class="primary" id="genRfq">Generate RFQ</button><pre id="rfqOut" class="card" style="white-space:pre-wrap"></pre>`}
function setup(){return `<h2>Add another GC workspace</h2><p class="muted" style="padding:0 0 8px">Do not mix another contractor’s jobs into BNZ.</p><input id="n" placeholder="Company name"/><input id="city" placeholder="City / state"/><input id="ph" placeholder="Phone"/><input id="em" placeholder="Email"/><input id="tr" placeholder="Trades"/><button class="primary" id="createCo">Create workspace</button>`}
function reply(text){const c=company();const a=AGENTS[state.agent];if(state.agent==="taylor")return `${a.name} — ${c.name}\nI will not invent a bid number from chat. Send drawings, specs, and bid date.\nJobs: ${(c.jobs||[]).map(j=>j.name).join("; ")||"none"}.`;if(state.agent==="emma")return `${a.name} — ${c.name}\nNeed trade, county, due date, prevailing wage yes/no.\nBench: ${(c.vendors||[]).map(v=>v.name).join("; ")||"empty"}.`;return `${a.name} — ${c.name}\nI draft RFQs inside this company only.\nYou asked: ${text}`;}
function bindForms(){const c=company();const sj=document.getElementById("saveJob");if(sj)sj.onclick=()=>{const name=document.getElementById("jn").value.trim();if(!name)return;c.jobs=c.jobs||[];c.jobs.push({name,loc:document.getElementById("jl").value,trade:document.getElementById("jt").value,status:document.getElementById("js").value||"Bidding"});persist(c);state.companies=load();paint();};const sv=document.getElementById("saveVendor");if(sv)sv.onclick=()=>{const name=document.getElementById("vn").value.trim();if(!name)return;c.vendors=c.vendors||[];c.vendors.push({name,trade:document.getElementById("vt").value,status:document.getElementById("vs").value||"New"});persist(c);state.companies=load();paint();};const g=document.getElementById("genRfq");if(g)g.onclick=()=>{document.getElementById("rfqOut").textContent=draftRfq(c,document.getElementById("rt").value,document.getElementById("rj").value,document.getElementById("rd").value,document.getElementById("rw").value);};const cr=document.getElementById("createCo");if(cr)cr.onclick=()=>{const name=document.getElementById("n").value.trim();if(!name)return;const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);persist({id,name,city:document.getElementById("city").value,phone:document.getElementById("ph").value,email:document.getElementById("em").value,trades:document.getElementById("tr").value.split(",").map(s=>s.trim()).filter(Boolean),jobs:[],vendors:[],notes:"Customer tenant.",serviceArea:"United States"});state.companies=load();state.active=id;state.view="overview";paint();};}
function paint(){renderCompanies();const c=company();document.getElementById("coName").textContent=c.name;document.getElementById("coMeta").textContent=[c.city,c.phone].filter(Boolean).join(" · ");document.getElementById("view").innerHTML=state.view==="jobs"?jobs():state.view==="vendors"?vendors():state.view==="rfq"?rfq():state.view==="setup"?setup():overview();const a=AGENTS[state.agent];document.getElementById("agentName").textContent=a.name;document.getElementById("agentRole").textContent=a.role;document.getElementById("liveBot").href=a.page;document.getElementById("liveBot").textContent="Open live "+a.name+" bot";bindForms();}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));paint();});
document.getElementById("agentPick").onchange=e=>{state.agent=e.target.value;paint();};
document.getElementById("send").onclick=()=>{const box=document.getElementById("prompt");const text=box.value.trim();if(!text)return;document.getElementById("thread").innerHTML+=`<div class="msg user">${text}</div><div class="msg">${reply(text)}</div>`;box.value="";};
paint();
</script></body></html>
